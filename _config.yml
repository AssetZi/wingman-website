# Site Settings
title: Weight Wingman
description: "The weight cutting app for wrestlers. AI meal tracking, daily calorie and water targets, NCAA/NFHS safety flags, and a live coach dashboard — make weight without wrecking your strength."
tagline: "The Weight Cutting App for Wrestlers"
logo: /assets/images/wingmanLogo.png
url: "https://weightwingman.com"
baseurl: ""
lang: en

# Build Settings
markdown: kramdown
permalink: /blog/:title/

# Pagination
paginate: 6
paginate_path: "/blog/page:num/"

# Plugins (all supported by GitHub Pages)
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate

# SEO Defaults
twitter:
  card: summary_large_image
og_image: /assets/images/og-image.png

# App-specific variables
app:
  name: "Weight Wingman"
  tagline: "Cutting Weight Doesn't Have to Suck"
  app_store_url: "https://apps.apple.com/us/app/weight-wingman/id6740700573"
  price_monthly: "$4.99"
  price_yearly: "$19.99"
  developer: "Zacherl Investments LLC"
  platforms: "iPhone, iPad, Mac, and Apple Vision"

# Meta test landing pages (/coach/, /cotton-mouth/, /parents/)
# Pixel ID from Meta Events Manager. The pixel include renders nothing while this is empty.
meta_pixel_id: ""
# App Store Connect campaign links, one per page
# (App Store Connect > Analytics > Acquisition > Campaigns). coach = "male", parents = "female".
campaigns:
  coach: "https://apps.apple.com/app/apple-store/id6740700573?pt=125547798&ct=nov-male&mt=8"
  cotton-mouth: "https://apps.apple.com/app/apple-store/id6740700573?pt=125547798&ct=nov-cotton&mt=8"
  parents: "https://apps.apple.com/app/apple-store/id6740700573?pt=125547798&ct=ww-nov-female&mt=8"
# Android interest form writes to the android_interest table. Publishable key only; it can insert, never read.
supabase:
  url: "https://jwybnzgdqpptrtsuvxwy.supabase.co"
  publishable_key: "sb_publishable_stST8LGT9gk5QwJMDfsp-w_Er7id8V_"

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "Weight Wingman Team"
  - scope:
      path: ""
    values:
      layout: default

theme: null

# Exclude from build
exclude:
  - Gemfile.lock
  - README.md
  - README-UPDATE.md
  - LICENSE
  - app.md
